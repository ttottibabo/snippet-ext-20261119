<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>내 문장 모음</title>
  <style>
    :root {
      --bg: #f5f2ea;
      --paper: #ffffff;
      --ink: #0e0e0e;
      --muted: #6b6860;
      --line: #0e0e0e;
      --lime: #d7ff3a;
      --pink: #ff4fa3;
      --blue: #4f7bff;
      --orange: #ff8a3d;
      --black: #0e0e0e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 360px;
      max-height: 580px;
      background: var(--bg);
      color: var(--ink);
      font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
      font-size: 13px;
      background-image: radial-gradient(rgba(0,0,0,.09) 1px, transparent 1px);
      background-size: 14px 14px;
    }
    .mono { font-family: ui-monospace, "Cascadia Code", Consolas, "Courier New", monospace; }

    /* ---------- HEADER ---------- */
    header {
      position: sticky;
      top: 0;
      z-index: 2;
      background: var(--bg);
      padding: 14px 16px 14px;
      border-bottom: 2px solid var(--line);
    }
    .ticker {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      letter-spacing: .12em;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .ticker .live::before {
      content: "";
      display: inline-block;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--lime);
      margin-right: 6px;
      vertical-align: 1px;
      box-shadow: 0 0 0 2px var(--ink);
    }
    .title-row {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
    }
    h1 {
      margin: 0;
      font-family: "Arial Black", "Malgun Gothic", Impact, sans-serif;
      font-weight: 900;
      font-size: 30px;
      line-height: .95;
      letter-spacing: -0.04em;
    }
    h1 .hl {
      background: var(--lime);
      color: var(--black);
      padding: 0 4px;
      display: inline-block;
      transform: rotate(-2deg);
    }
    .count {
      flex-shrink: 0;
      background: var(--pink);
      color: var(--black);
      border: 2px solid var(--line);
      box-shadow: 3px 3px 0 var(--line);
      padding: 4px 8px;
      font-size: 11px;
      font-weight: 800;
      transform: rotate(3deg);
    }
    .count b { font-size: 15px; }

    .search {
      width: 100%;
      padding: 10px 12px;
      border: 2px solid var(--line);
      border-radius: 0;
      background: var(--paper);
      color: var(--ink);
      font: inherit;
      font-weight: 600;
      outline: none;
      transition: box-shadow .12s, transform .12s;
    }
    .search::placeholder { color: var(--muted); }
    .search:focus {
      box-shadow: 4px 4px 0 var(--pink);
      transform: translate(-2px, -2px);
    }

    /* ---------- LIST ---------- */
    main {
      padding: 16px 16px 8px;
      overflow-y: auto;
      max-height: 400px;
    }
    main::-webkit-scrollbar { width: 6px; }
    main::-webkit-scrollbar-thumb { background: var(--ink); }
    ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }

    .item {
      --c: var(--lime);
      position: relative;
      background: var(--c);
      color: var(--black);
      border: 2px solid var(--line);
      box-shadow: 4px 4px 0 var(--line);
      padding: 14px 14px 10px;
      transition: transform .12s, box-shadow .12s;
    }
    .item:nth-child(4n+2) { --c: var(--pink); }
    .item:nth-child(4n+3) { --c: var(--blue); color: var(--paper); }
    .item:nth-child(4n+4) { --c: var(--orange); }
    .item:hover {
      transform: translate(-2px, -2px) rotate(-.4deg);
      box-shadow: 6px 6px 0 var(--line);
    }
    .item::before {
      content: "“";
      position: absolute;
      top: -11px;
      left: 10px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 26px;
      font-weight: 900;
      line-height: 30px;
      text-align: center;
      color: var(--ink);
      background: var(--paper);
      border: 2px solid var(--line);
      width: 24px; height: 20px;
      overflow: hidden;
    }
    .text {
      margin: 8px 0 10px;
      font-size: 15px;
      font-weight: 800;
      line-height: 1.45;
      letter-spacing: -0.02em;
      white-space: pre-wrap;
      word-break: keep-all;
      overflow-wrap: anywhere;
    }
    .text.clamped {
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
      cursor: pointer;
    }
    .meta {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 10px;
      border-top: 2px dashed currentColor;
      padding-top: 8px;
    }
    .source {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: inherit;
      text-decoration: none;
      font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
      text-transform: uppercase;
      letter-spacing: .04em;
      opacity: .8;
    }
    .source:hover { opacity: 1; text-decoration: underline; }
    .actions { display: flex; gap: 6px; }
    .btn {
      border: 2px solid var(--black);
      background: var(--black);
      color: var(--paper);
      font: inherit;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .06em;
      padding: 3px 8px;
      border-radius: 0;
      cursor: pointer;
      text-transform: uppercase;
    }
    .item:nth-child(4n+3) .btn { border-color: var(--paper); }
    .btn:hover { background: var(--paper); color: var(--black); border-color: var(--black); }
    .btn.del { background: transparent; color: inherit; border-color: currentColor; }
    .btn.del:hover { background: var(--black); color: var(--pink); border-color: var(--black); }

    /* ---------- EMPTY ---------- */
    .empty {
      text-align: center;
      padding: 28px 12px 20px;
      color: var(--muted);
      line-height: 1.7;
      font-weight: 600;
    }
    .empty .mark {
      display: inline-block;
      font-family: "Arial Black", Impact, sans-serif;
      font-size: 22px;
      color: var(--black);
      background: var(--lime);
      border: 2px solid var(--line);
      box-shadow: 4px 4px 0 var(--pink);
      padding: 6px 12px;
      transform: rotate(-4deg);
      margin-bottom: 14px;
    }
    .empty b { color: var(--ink); background: var(--lime); padding: 0 3px; }

    /* ---------- FOOTER ---------- */
    footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px 12px;
      border-top: 2px solid var(--line);
      background: var(--bg);
    }
    .hint {
      color: var(--muted);
      font-size: 10px;
      letter-spacing: .06em;
    }
    .btn.clear {
      background: var(--paper);
      color: var(--ink);
      border-color: var(--ink);
      box-shadow: 2px 2px 0 var(--pink);
    }
    .btn.clear:hover { background: var(--pink); color: var(--black); border-color: var(--black); }

    /* ---------- TOAST ---------- */
    .toast {
      position: fixed;
      left: 50%;
      bottom: 54px;
      transform: translateX(-50%) translateY(10px) rotate(-2deg);
      background: var(--lime);
      color: var(--black);
      border: 2px solid var(--black);
      box-shadow: 3px 3px 0 var(--pink);
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 900;
      opacity: 0;
      pointer-events: none;
      transition: opacity .15s, transform .15s;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0) rotate(-2deg); }
    .toast.has-undo {
      display: flex;
      align-items: center;
      gap: 10px;
      white-space: nowrap;
      padding: 5px 6px 5px 14px;
      transform: translateX(-50%) translateY(10px);
    }
    .toast.has-undo.show { pointer-events: auto; transform: translateX(-50%) translateY(0); }
    .toast .undo {
      border: 2px solid var(--black);
      background: var(--black);
      color: var(--lime);
      font: inherit;
      font-size: 11px;
      font-weight: 900;
      padding: 3px 10px;
      cursor: pointer;
    }
    .toast .undo:hover { background: var(--pink); color: var(--black); }
  </style>
</head>
<body>
  <header>
    <div class="ticker mono">
      <span class="live">my lines</span>
      <span>vol.01 · collect your words</span>
    </div>
    <div class="title-row">
      <h1>내 문장<br><span class="hl">모음</span></h1>
      <span class="count" id="count"></span>
    </div>
    <input id="search" class="search" type="search" placeholder="🔍  문장 찾기…" autocomplete="off">
  </header>

  <main>
    <ul id="list"></ul>
    <div id="empty" class="empty" hidden>
      <div class="mark">NO LINES YET</div>
      <p id="emptyMsg">아직 모은 문장이 없어요.<br>
        웹페이지에서 문장을 드래그한 뒤<br>
        오른쪽 클릭 → <b>내 문장 모음에 저장</b></p>
    </div>
  </main>

  <footer>
    <span class="hint mono">TAP A LINE TO EXPAND ↓</span>
    <button id="clearAll" class="btn clear" type="button">전체 삭제</button>
  </footer>

  <div id="toast" class="toast" role="status"></div>

  <script src="popup.js"></script>
</body>
</html>
